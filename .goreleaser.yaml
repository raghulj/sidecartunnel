# GoReleaser configuration — https://goreleaser.com
#
# Cutting a release is `git tag vX.Y.Z && git push --tags`; everything below is what that
# tag turns into. The runbook is docs/15-releasing.md.
#
# Verify locally without tagging anything:
#
#   goreleaser check
#   goreleaser release --snapshot --clean

version: 2

# The registry and repository the images are published to. Override it to release the
# same code somewhere else without editing this file:
#
#     IMAGE_REPO=registry.example.com/team/sidecartunnel goreleaser release
#
# The release workflow passes it through, so a fork changes one repository variable in
# GitHub settings rather than patching six image_templates and getting one of them wrong.
env:
  # `index .Env` rather than envOrDefault: envOrDefault treats set-but-empty as set,
  # and an unset GitHub Actions `vars.X` arrives as the empty string, not as absent.
  # With envOrDefault that produced an image named ":v0.1.0-amd64" - no repository at
  # all - which builds locally and fails at push. Caught before it shipped by testing
  # the empty case rather than only unset and set.
  - IMAGE_REPO={{ $r := index .Env "IMAGE_REPO" }}{{ if $r }}{{ $r }}{{ else }}ghcr.io/raghulj/sidecartunnel{{ end }}

project_name: sidecartunnel

# NFR-6 targets a release image under 20 MB and the binary is nearly all of it, so the
# number belongs in the release log where a regression is visible.
report_sizes: true

before:
  hooks:
    # Not `go mod tidy`: a release must not mutate the tree it is building from. CI
    # already fails a pull request whose go.mod is untidy.
    - go mod download
    - go mod verify

builds:
  - id: sidecartunnel
    main: ./cmd/sidecartunnel
    binary: sidecartunnel

    # CGO_ENABLED=0 is what makes the binary run on a base image with no libc at all.
    env:
      - CGO_ENABLED=0

    # -trimpath strips the builder's directory names, so the artifact does not depend on
    # where it was built. Same flags as the Makefile and the Dockerfile.
    flags:
      - -trimpath

    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

    # Fixed to the commit's own timestamp rather than the clock, so two builds of one tag
    # produce identical bytes.
    mod_timestamp: "{{ .CommitTimestamp }}"

    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - sidecartunnel

    # tar.gz everywhere except Windows, where zip is the format that opens without extra
    # tooling.
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  # One SBOM per archive, generated by syft. The release workflow installs syft; a local
  # `goreleaser release --snapshot` without it will skip this step and say so.
  - id: archives
    artifacts: archive

signs:
  # Keyless signing: cosign gets a short-lived certificate from Fulcio, tied to this
  # workflow's OIDC identity, and the signature lands in the Rekor transparency log.
  # There is no private key to leak, rotate, or forget to rotate.
  #
  # Only checksums.txt is signed, not each archive. The checksum file already covers
  # every archive by sha256, so one signature over it is one signature over all of them;
  # signing six archives separately would produce six things to verify and the same
  # guarantee.
  #
  # cosign 3 replaced --output-signature and --output-certificate with a single Sigstore
  # bundle holding the signature, the certificate and the Rekor inclusion proof together.
  # So this publishes checksums.txt.bundle where v0.1.1 published checksums.txt.sig and
  # checksums.txt.pem. One file, one flag on the verify side, and the inclusion proof no
  # longer has to be re-fetched from Rekor at verification time.
  #
  #   cosign verify-blob \
  #     --bundle checksums.txt.bundle \
  #     --certificate-identity-regexp 'https://github.com/raghulj/sidecartunnel/.*' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     checksums.txt
  - id: checksums
    cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

docker_signs:
  # The manifest lists, signed by digest rather than by tag. A tag is mutable — signing
  # `:latest` would sign whatever `:latest` happens to point at when someone verifies,
  # which is not a signature over anything in particular. `${artifact}@${digest}` pins it
  # to the bytes that were actually built here.
  #
  # --registry-referrers-mode=legacy is explicit rather than inherited. cosign 3 can store
  # a container signature as an OCI 1.1 referring artifact instead of the `.sig` tag, and
  # that changes where every verifier has to look. Legacy is what v0.1.1 published and what
  # the documented `cosign verify` command finds, so the storage format stays put while the
  # tool moves. Switching it is a separate decision with its own compatibility question,
  # not a side effect of a version bump.
  #
  #   cosign verify ghcr.io/raghulj/sidecartunnel:v0.1.2 \
  #     --certificate-identity-regexp 'https://github.com/raghulj/sidecartunnel/.*' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  - id: manifests
    cmd: cosign
    artifacts: manifests
    output: true
    args:
      - sign
      - "--registry-referrers-mode=legacy"
      - "${artifact}@${digest}"
      - "--yes"

dockers:
  # The OCI labels are NOT here. They are `LABEL` instructions in the Dockerfile, so that
  # a release image and a `docker build .` carry the same metadata. As nine `--label`
  # flags duplicated across both blocks below, the release image had all nine and every
  # other build path had none.
  #
  # One entry per architecture, joined into a manifest list below. The Dockerfile compiles
  # from source rather than copying the archive binary, which costs a rebuild but keeps a
  # bare `docker build .` working from a clean checkout — and its build stage pins
  # --platform=$BUILDPLATFORM, so the cross-compile stays native instead of running the Go
  # toolchain under QEMU.
  - id: linux-amd64
    ids:
      - sidecartunnel
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "{{ .Env.IMAGE_REPO }}:{{ .Tag }}-amd64"
      # The moving tags are built only for a real release. A prerelease is a rehearsal:
      # `release.prerelease: auto` already keeps v0.2.0-rc.1 out of the "latest release"
      # slot on GitHub, and without these guards the same tag would still repoint
      # :latest and :X.Y at the release candidate in the registry. An empty template is
      # skipped.
      - "{{ if not .Prerelease }}{{ .Env.IMAGE_REPO }}:{{ .Major }}.{{ .Minor }}-amd64{{ end }}"
      - "{{ if not .Prerelease }}{{ .Env.IMAGE_REPO }}:latest-amd64{{ end }}"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .FullCommit }}"
      - "--build-arg=DATE={{ .Date }}"
    extra_files:
      # The build context the Dockerfile needs. Deliberately not the whole tree: docs/ and
      # the HTML companions are large and would land in the build cache key.
      - go.mod
      - go.sum
      - cmd
      - internal
      - README.md
      - LICENSE

  - id: linux-arm64
    ids:
      - sidecartunnel
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "{{ .Env.IMAGE_REPO }}:{{ .Tag }}-arm64"
      # The moving tags are built only for a real release. A prerelease is a rehearsal:
      # `release.prerelease: auto` already keeps v0.2.0-rc.1 out of the "latest release"
      # slot on GitHub, and without these guards the same tag would still repoint
      # :latest and :X.Y at the release candidate in the registry. An empty template is
      # skipped.
      - "{{ if not .Prerelease }}{{ .Env.IMAGE_REPO }}:{{ .Major }}.{{ .Minor }}-arm64{{ end }}"
      - "{{ if not .Prerelease }}{{ .Env.IMAGE_REPO }}:latest-arm64{{ end }}"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .FullCommit }}"
      - "--build-arg=DATE={{ .Date }}"
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
      - README.md
      - LICENSE

docker_manifests:
  # What anyone actually pulls. The per-architecture tags above exist only to be joined
  # here.
  - name_template: "{{ .Env.IMAGE_REPO }}:{{ .Tag }}"
    image_templates:
      - "{{ .Env.IMAGE_REPO }}:{{ .Tag }}-amd64"
      - "{{ .Env.IMAGE_REPO }}:{{ .Tag }}-arm64"

  # Guarded the same way as the per-architecture tags above: a manifest whose
  # name_template renders empty is skipped, so a prerelease publishes :vX.Y.Z-rc.N and
  # nothing else.
  - name_template: "{{ if not .Prerelease }}{{ .Env.IMAGE_REPO }}:{{ .Major }}.{{ .Minor }}{{ end }}"
    image_templates:
      - "{{ .Env.IMAGE_REPO }}:{{ .Major }}.{{ .Minor }}-amd64"
      - "{{ .Env.IMAGE_REPO }}:{{ .Major }}.{{ .Minor }}-arm64"

  - name_template: "{{ if not .Prerelease }}{{ .Env.IMAGE_REPO }}:latest{{ end }}"
    image_templates:
      - "{{ .Env.IMAGE_REPO }}:latest-amd64"
      - "{{ .Env.IMAGE_REPO }}:latest-arm64"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Refactors
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 99
  filters:
    # Documentation and housekeeping commits are noise in a release note. The
    # specification changes that matter arrive with the code that implements them, under
    # feat or fix.
    exclude:
      - '^docs(\([[:word:]]+\))??!?:'
      - '^chore(\([[:word:]]+\))??!?:'
      - '^test(\([[:word:]]+\))??!?:'
      - '^ci(\([[:word:]]+\))??!?:'
      - '^style(\([[:word:]]+\))??!?:'
      - '^build\(deps\):'
      - "^Merge (branch|pull request)"
      - "typo"

snapshot:
  # Makes `goreleaser release --snapshot --clean` work on an untagged tree, so the whole
  # pipeline can be rehearsed before anything is tagged or pushed.
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

release:
  github:
    owner: raghulj
    name: sidecartunnel
  # A tag such as v0.2.0-rc.1 becomes a GitHub pre-release without a flag being remembered.
  prerelease: auto
  draft: false
  footer: |
    ## Container Images

    ```
    docker pull {{ .Env.IMAGE_REPO }}:{{ .Tag }}
    ```

    Pin the digest, not the tag — the digest is appended to these notes by the release
    workflow, below.

    Images and `checksums.txt` are signed with [cosign](https://docs.sigstore.dev) keyless,
    against this workflow's OIDC identity. There is no public key to fetch:

    ```
    cosign verify {{ .Env.IMAGE_REPO }}:{{ .Tag }} \
      --certificate-identity-regexp 'https://github.com/raghulj/sidecartunnel/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com

    cosign verify-blob \
      --bundle checksums.txt.bundle \
      --certificate-identity-regexp 'https://github.com/raghulj/sidecartunnel/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    ```

    Every artifact also carries a signed build provenance attestation, which needs no
    cosign install:

    ```
    gh attestation verify oci://{{ .Env.IMAGE_REPO }}:{{ .Tag }} --repo raghulj/sidecartunnel
    ```

    Release procedure and the archive verification steps:
    [docs/15-releasing.md](https://github.com/raghulj/sidecartunnel/blob/main/docs/15-releasing.md).
