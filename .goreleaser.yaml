# GoReleaser configuration — https://goreleaser.com
#
# Cutting a release is `git tag vX.Y.Z && git push --tags`; everything below is what that
# tag turns into. The runbook is docs/15-releasing.md.
#
# Verify locally without tagging anything:
#
#   goreleaser check
#   goreleaser release --snapshot --clean

version: 2

# The registry and repository the images are published to. Override it to release the
# same code somewhere else without editing this file:
#
#     IMAGE_REPO=registry.example.com/team/sidecartunnel goreleaser release
#
# The release workflow passes it through, so a fork changes one repository variable in
# GitHub settings rather than patching six image_templates and getting one of them wrong.
env:
  # `index .Env` rather than envOrDefault: envOrDefault treats set-but-empty as set,
  # and an unset GitHub Actions `vars.X` arrives as the empty string, not as absent.
  # With envOrDefault that produced an image named ":v0.1.0-amd64" - no repository at
  # all - which builds locally and fails at push. Caught before it shipped by testing
  # the empty case rather than only unset and set.
  - IMAGE_REPO={{ $r := index .Env "IMAGE_REPO" }}{{ if $r }}{{ $r }}{{ else }}ghcr.io/raghulj/sidecartunnel{{ end }}

project_name: sidecartunnel

# NFR-6 targets a release image under 20 MB and the binary is nearly all of it, so the
# number belongs in the release log where a regression is visible.
report_sizes: true

before:
  hooks:
    # Not `go mod tidy`: a release must not mutate the tree it is building from. CI
    # already fails a pull request whose go.mod is untidy.
    - go mod download
    - go mod verify

builds:
  - id: sidecartunnel
    main: ./cmd/sidecartunnel
    binary: sidecartunnel

    # CGO_ENABLED=0 is what makes the binary run on a base image with no libc at all.
    env:
      - CGO_ENABLED=0

    # -trimpath strips the builder's directory names, so the artifact does not depend on
    # where it was built. Same flags as the Makefile and the Dockerfile.
    flags:
      - -trimpath

    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

    # Fixed to the commit's own timestamp rather than the clock, so two builds of one tag
    # produce identical bytes.
    mod_timestamp: "{{ .CommitTimestamp }}"

    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - sidecartunnel

    # tar.gz everywhere except Windows, where zip is the format that opens without extra
    # tooling.
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  # One SBOM per archive, generated by syft. The release workflow installs syft; a local
  # `goreleaser release --snapshot` without it will skip this step and say so.
  - id: archives
    artifacts: archive

dockers:
  # One entry per architecture, joined into a manifest list below. The Dockerfile compiles
  # from source rather than copying the archive binary, which costs a rebuild but keeps a
  # bare `docker build .` working from a clean checkout — and its build stage pins
  # --platform=$BUILDPLATFORM, so the cross-compile stays native instead of running the Go
  # toolchain under QEMU.
  - id: linux-amd64
    ids:
      - sidecartunnel
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "{{ .Env.IMAGE_REPO }}:{{ .Tag }}-amd64"
      - "{{ .Env.IMAGE_REPO }}:{{ .Major }}.{{ .Minor }}-amd64"
      - "{{ .Env.IMAGE_REPO }}:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .FullCommit }}"
      - "--build-arg=DATE={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Websocket gateway for applications that cannot hold long-lived connections"
      - "--label=org.opencontainers.image.url=https://github.com/raghulj/sidecartunnel"
      - "--label=org.opencontainers.image.source=https://github.com/raghulj/sidecartunnel"
      - "--label=org.opencontainers.image.documentation=https://github.com/raghulj/sidecartunnel/tree/main/docs"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.licenses=MIT"
    extra_files:
      # The build context the Dockerfile needs. Deliberately not the whole tree: docs/ and
      # the HTML companions are large and would land in the build cache key.
      - go.mod
      - go.sum
      - cmd
      - internal
      - README.md
      - LICENSE

  - id: linux-arm64
    ids:
      - sidecartunnel
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "{{ .Env.IMAGE_REPO }}:{{ .Tag }}-arm64"
      - "{{ .Env.IMAGE_REPO }}:{{ .Major }}.{{ .Minor }}-arm64"
      - "{{ .Env.IMAGE_REPO }}:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .FullCommit }}"
      - "--build-arg=DATE={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Websocket gateway for applications that cannot hold long-lived connections"
      - "--label=org.opencontainers.image.url=https://github.com/raghulj/sidecartunnel"
      - "--label=org.opencontainers.image.source=https://github.com/raghulj/sidecartunnel"
      - "--label=org.opencontainers.image.documentation=https://github.com/raghulj/sidecartunnel/tree/main/docs"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.licenses=MIT"
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
      - README.md
      - LICENSE

docker_manifests:
  # What anyone actually pulls. The per-architecture tags above exist only to be joined
  # here.
  - name_template: "{{ .Env.IMAGE_REPO }}:{{ .Tag }}"
    image_templates:
      - "{{ .Env.IMAGE_REPO }}:{{ .Tag }}-amd64"
      - "{{ .Env.IMAGE_REPO }}:{{ .Tag }}-arm64"

  - name_template: "{{ .Env.IMAGE_REPO }}:{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "{{ .Env.IMAGE_REPO }}:{{ .Major }}.{{ .Minor }}-amd64"
      - "{{ .Env.IMAGE_REPO }}:{{ .Major }}.{{ .Minor }}-arm64"

  - name_template: "{{ .Env.IMAGE_REPO }}:latest"
    image_templates:
      - "{{ .Env.IMAGE_REPO }}:latest-amd64"
      - "{{ .Env.IMAGE_REPO }}:latest-arm64"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Refactors
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 99
  filters:
    # Documentation and housekeeping commits are noise in a release note. The
    # specification changes that matter arrive with the code that implements them, under
    # feat or fix.
    exclude:
      - '^docs(\([[:word:]]+\))??!?:'
      - '^chore(\([[:word:]]+\))??!?:'
      - '^test(\([[:word:]]+\))??!?:'
      - '^ci(\([[:word:]]+\))??!?:'
      - '^style(\([[:word:]]+\))??!?:'
      - '^build\(deps\):'
      - "^Merge (branch|pull request)"
      - "typo"

snapshot:
  # Makes `goreleaser release --snapshot --clean` work on an untagged tree, so the whole
  # pipeline can be rehearsed before anything is tagged or pushed.
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

release:
  github:
    owner: raghulj
    name: sidecartunnel
  # A tag such as v0.2.0-rc.1 becomes a GitHub pre-release without a flag being remembered.
  prerelease: auto
  draft: false
  footer: |
    ## Container Images

    ```
    docker pull ghcr.io/raghulj/sidecartunnel:{{ .Tag }}
    ```

    Verify an archive against `checksums.txt` before running it. Release procedure and
    verification steps: [docs/15-releasing.md](https://github.com/raghulj/sidecartunnel/blob/main/docs/15-releasing.md).
