# app + gateway + redis + a proxy that puts them on one origin.
#
#     cp .env.example .env && $EDITOR .env && docker compose up --build
#     open http://localhost:8080
#
# Open the page in two tabs. A message sent in one arrives in the other over the
# websocket. docs/16-integration-guide.md walks the same flow from the command line.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [webapp]

  webapp:
    build: .
    env_file: .env
    environment:
      # Where the bind mount below lands. app.py defaults to the checkout layout —
      # three directories above examples/flask/app.py — which does not exist inside the
      # image, where app.py is /app/app.py.
      ST_CLIENT_JS_DIR: /client/js
    volumes:
      # The client library, at the path templates/index.html imports it from. A real
      # application copies sidecartunnel.js into its own static directory instead.
      - ../../client/js:/client/js:ro
    depends_on: [redis]
    # Port 5000 is deliberately not published. The proxy is the only way in, which is
    # what keeps the websocket and the application on one origin.

  sidecartunnel:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      # docs/08-config.md §3. One app block: multi-app was cut, so there is no index in
      # these names. ST_ prefix, __ for nesting.
      ST_SERVER__ALLOWED_ORIGINS: "${ST_ALLOWED_ORIGINS}"
      ST_APP__CONNECT_URL: "http://webapp:5000/_st/connect"
      ST_APP__WEBHOOK_SECRETS: "${ST_WEBHOOK_SECRETS}"
      ST_CONTROL__SECRET: "${ST_CONTROL_SECRET}"
      ST_BUS__URL: "redis://redis:6379/3"
      ST_BUS__PREFIX: "${ST_BUS_PREFIX}"
      # Lists of objects cannot be expressed in environment variables, so namespaces
      # needs the YAML file or this. With neither, a built-in default block catches
      # every channel and subscribes still succeed.
      #
      # The fourth entry, the empty name, is the reserved namespace separator-less
      # channels resolve to (docs/08-config.md §3). The demo grants `status`, which has
      # no separator; without this entry it resolves to no block, fails closed, and is
      # omitted from the connect reply with no error anywhere. Once a list is written
      # the built-in catch-all is not installed, so every namespace in use must appear.
      ST_NAMESPACES_JSON: '[{"name":"room"},{"name":"user"},{"name":"org"},{"name":""}]'
      ST_LOG__LEVEL: "debug"
    depends_on: [redis]
    # No ports: block. The websocket is reached through the caddy proxy above, same-origin
    # with the application; nothing needs to publish this service's own port.

  redis:
    image: redis:7-alpine
    # Raised from the default 32mb 8mb 60. At the default, Redis evicts the gateway
    # during a broadcast burst and the resubscribe leaves it behind again — a stable
    # oscillation, not a transient. docs/10-operations.md §3.
    command: >
      redis-server
      --client-output-buffer-limit "pubsub 256mb 64mb 60"
      --save ""
