name: release

# A tag is the only trigger. Everything the release contains is derived from it:
# archives, checksums, SBOMs, GitHub release notes and the multi-arch image on ghcr.io.
#
# The gates run first and the release depends on them. A tag that fails the coverage gate
# produces no artifacts at all — a release that shipped untested code would be worse than
# a release that did not happen, because it is the version people pin.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # The integration layer needs a real Redis. Point it at the service container.
  ST_BUS__URL: redis://localhost:6379/0

jobs:
  verify:
    name: test and coverage gate
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Test with the race detector
        run: go test -race -cover ./...

      - name: Coverage gate
        # 100% statement coverage per package, the same script CI and a laptop run.
        # docs/14-coding-standards.md §3.
        run: ./scripts/cover.sh coverage.out

  release:
    name: goreleaser
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      # Create the GitHub release and upload artifacts to it.
      contents: write
      # Push the image to ghcr.io.
      packages: write
      # The OIDC token cosign exchanges with Fulcio for a short-lived signing certificate.
      # This is what makes the signatures keyless: the identity being attested is this
      # workflow, not a private key sitting in a repository secret.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from the commit range since the previous tag,
          # so a shallow clone produces an empty one.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Set up QEMU
        # Registers the binfmt handlers buildx needs to touch a non-native architecture.
        # The Go cross-compile itself stays native — the Dockerfile's build stage pins
        # --platform=$BUILDPLATFORM — but the base image manifests still have to resolve.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install syft
        # GoReleaser shells out to syft for the SBOMs; without it on PATH the sbom step
        # fails the release.
        uses: anchore/sbom-action/download-syft@v0

      - name: Install cosign
        # GoReleaser shells out to cosign for `signs` and `docker_signs`, the same way it
        # does to syft. Without it on PATH the signing steps fail the release rather than
        # skipping quietly, which is the behaviour I want: a release that silently stopped
        # signing looks identical to one that never signed.
        uses: sigstore/cosign-installer@v3

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Defaults to ghcr.io/<owner>/<repo> when the variable is unset, so a fork
          # publishes to its own registry by setting one repository variable rather
          # than editing .goreleaser.yaml (Settings -> Secrets and variables -> Actions).
          IMAGE_REPO: ${{ vars.IMAGE_REPO }}
