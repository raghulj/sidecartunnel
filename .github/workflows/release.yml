name: release

# A tag is the only trigger. Everything the release contains is derived from it:
# archives, checksums, SBOMs, GitHub release notes and the multi-arch image on ghcr.io.
#
# The gates run first and the release depends on them. A tag that fails the coverage gate
# produces no artifacts at all — a release that shipped untested code would be worse than
# a release that did not happen, because it is the version people pin.
#
# Every `uses:` here is pinned to a commit SHA with the version in a trailing comment,
# never to a tag. A tag on someone else's repository is a pointer they can move, and this
# job holds `contents: write`, `packages: write` and an OIDC token that signs in my name —
# moving one of those tags is enough to publish a release with my identity on it. That is
# how tj-actions/changed-files went. Dependabot updates the SHAs and rewrites the comment,
# so the pin costs nothing to keep current.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # The integration layer needs a real Redis. Point it at the service container.
  ST_BUS__URL: redis://localhost:6379/0

jobs:
  verify:
    name: test and coverage gate
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true

      - name: Test with the race detector
        run: go test -race -cover ./...

      - name: Coverage gate
        # 100% statement coverage per package, the same script CI and a laptop run.
        # docs/14-coding-standards.md §3.
        run: ./scripts/cover.sh coverage.out

  release:
    name: goreleaser
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      # Create the GitHub release and upload artifacts to it.
      contents: write
      # Push the image to ghcr.io.
      packages: write
      # The OIDC token cosign and the attestation action exchange with Fulcio for a
      # short-lived signing certificate. This is what makes the signatures keyless: the
      # identity being attested is this workflow, not a private key sitting in a
      # repository secret.
      id-token: write
      # Record the build provenance attestations against this repository.
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from the commit range since the previous tag,
          # so a shallow clone produces an empty one.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true

      - name: Set up QEMU
        # Registers the binfmt handlers buildx needs to touch a non-native architecture.
        # The Go cross-compile itself stays native — the Dockerfile's build stage pins
        # --platform=$BUILDPLATFORM — but the base image manifests still have to resolve.
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install syft
        # GoReleaser shells out to syft for the SBOMs; without it on PATH the sbom step
        # fails the release.
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Install cosign
        # GoReleaser shells out to cosign for `signs` and `docker_signs`, the same way it
        # does to syft. Without it on PATH the signing steps fail the release rather than
        # skipping quietly, which is the behaviour I want: a release that silently stopped
        # signing looks identical to one that never signed.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned explicitly rather than inherited from the installer's default, so the
          # tool that produces the signatures is a decision recorded here and not a
          # consequence of a Dependabot bump. Moving it changes what a release publishes:
          # cosign 3 dropped --output-signature and --output-certificate from sign-blob in
          # favour of a single Sigstore bundle, so releases from v0.1.2 carry
          # checksums.txt.bundle where v0.1.1 carried checksums.txt.sig and
          # checksums.txt.pem. .goreleaser.yaml and docs/15-releasing.md §4 have the
          # detail, and the image signature format is held at legacy on purpose.
          cosign-release: v3.0.6

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Defaults to ghcr.io/<owner>/<repo> when the variable is unset, so a fork
          # publishes to its own registry by setting one repository variable rather
          # than editing .goreleaser.yaml (Settings -> Secrets and variables -> Actions).
          IMAGE_REPO: ${{ vars.IMAGE_REPO }}

      - name: Resolve the published manifest digest
        # Everything downstream addresses the image by digest, never by tag. A tag is a
        # mutable pointer: attesting `:v1.2.3` attests whatever `:v1.2.3` happens to point
        # at when someone verifies it, which is not a statement about any particular
        # bytes. The manifest list was pushed one step ago; this reads back the digest it
        # actually landed on, and that digest is what goes in the release notes for people
        # to pin.
        id: image
        env:
          IMAGE_REPO: ${{ vars.IMAGE_REPO }}
        run: |
          set -euo pipefail
          # Same fallback as .goreleaser.yaml: an unset repository variable arrives as the
          # empty string, not as absent, so test the value rather than whether it is set.
          repo="${IMAGE_REPO:-}"
          if [ -z "${repo}" ]; then
            repo="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          fi
          digest="$(docker buildx imagetools inspect "${repo}:${GITHUB_REF_NAME}" \
            --format '{{ .Manifest.Digest }}')"
          echo "repo=${repo}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Image digest::${repo}@${digest}"

      - name: Image SBOM
        # GoReleaser produces one SBOM per archive. The archives are not what production
        # runs — the image is, and it carried no SBOM at all, which is the one that
        # matters when an advisory lands against something in the base layer. syft is
        # already on PATH from the install step above.
        env:
          IMAGE_REF: ${{ steps.image.outputs.repo }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          syft scan "registry:${IMAGE_REF}" \
            -o spdx-json="dist/sidecartunnel_${version}_image.sbom.json"

      - name: Attach the image SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/sidecartunnel_${version}_image.sbom.json" --clobber

      - name: Publish the digest in the release notes
        # The release notes are the one place everybody looks, so the digest to pin goes
        # there rather than behind an `imagetools inspect` most people will not run. A tag
        # is a pointer; this is the bytes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ${{ steps.image.outputs.repo }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          body="$(gh release view "${GITHUB_REF_NAME}" --json body --jq '.body')"
          printf '%s\n\n### Pin This Digest\n\n```\n%s@%s\n```\n\nThe tag above is a mutable pointer; the digest is not. Deployments should name the digest.\n' \
            "${body}" "${IMAGE_REPO}" "${IMAGE_DIGEST}" > release-notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md

      - name: Attest the image
        # Signed provenance: what built this image, from which commit, with which
        # workflow. cosign's signature says "this workflow signed these bytes";
        # provenance says how the bytes came to exist. `gh attestation verify` checks it
        # without cosign installed, which matters for the people who will actually run
        # the check.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repo }}
          subject-digest: ${{ steps.image.outputs.digest }}
          # Also stored alongside the image in GHCR, so a puller with the digest and no
          # access to this repository's attestation store can still verify it.
          push-to-registry: true

      - name: Attest the release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
