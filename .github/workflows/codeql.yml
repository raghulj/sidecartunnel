name: codeql

# Static analysis for Go. This is a public gateway that holds every connected user's
# session cookie in memory (docs/05-authorization.md §8), so the analysis runs on every
# change and again weekly — a rule added to the CodeQL pack after a commit lands would
# otherwise never see it.
#
# Actions are pinned to commit SHAs, not tags; the reasoning is in release.yml. Dependabot
# keeps them current.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 04:17 UTC. An odd minute so the run is not queued behind everyone else's
    # top-of-the-hour cron.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze go
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Upload the SARIF results to the repository's security tab.
      security-events: write
      # Read the workflow run status for the alert timeline.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is a superset of the default pack. The quality rules are
          # noisier, and worth it here: the failure modes this project cares about —
          # a lock held across network I/O, an unchecked error on a close path — are the
          # ones that only appear under load.
          queries: security-and-quality

      - name: Build
        # Explicit rather than autobuild, so the analysis compiles the same way CI does.
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
